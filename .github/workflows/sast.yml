name: SAST
# MicroHealth's shared static analysis: Opengrep with MicroHealth's rules
# (MicroHealthLLC/sast-rules). The pin below is moved by a pull request that
# sast-rules opens on each release; merging it is how this repository takes
# new rules.
on:
  schedule:
    # Daily — 10:30 PM US Eastern (EDT) = 02:30 UTC the next day
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    permissions: {contents: read, actions: read, security-events: write, id-token: write}
    uses: MicroHealthLLC/sast-rules/.github/workflows/opengrep.yml@d7c3dad1ed1fe24d092f469360ca68d00a3a654d # v2026.10.0
    with:
      aws_region: ${{ vars.AWS_REGION_EAST_1 }}
      s3_bucket: ${{ vars.SECURITY_REPORTS_S3_BUCKET }}
    secrets: inherit
